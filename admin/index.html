<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:36px 20px 72px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}
h1{margin:0;font-size:1.5rem;font-weight:700}
h2{margin:0 0 12px;font-size:.95rem;font-weight:650}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.hint{margin:0 0 14px;color:var(--muted);font-size:.86rem}
.row{display:grid;grid-template-columns:28px 1fr 1.4fr 1fr 44px auto;gap:8px;margin-bottom:8px;align-items:center;border-radius:12px}
.row.over{outline:2px dashed var(--accent);outline-offset:3px}
.row.drag{opacity:.4}
.grip{cursor:grab;text-align:center;color:var(--muted);user-select:none;font-size:1.1rem}
.clk{text-align:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:.9rem}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:.88rem;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.del{color:var(--danger)}
.btns{display:flex;gap:4px}
.pw{display:flex;gap:8px;margin-top:18px;max-width:420px}
#status{margin-top:12px;min-height:1.4em;font-size:.9rem}
.pv{position:sticky;top:16px}
.pvg{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}
.cat{font-size:.72rem;font-weight:650;color:var(--muted);margin-top:6px}
.mini{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));font-size:.85rem}
.mini b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.25);flex:none}
.mini span{min-width:0}.mini i{display:block;font-style:normal;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini small{display:block;opacity:.8;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.layout{grid-template-columns:1fr}.pv{position:static}}
@media (max-width:640px){.row{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}.grip{display:none}.clk{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Admin</h1><a href="/">Lihat halaman</a></header>
  <div class="layout">
    <div class="panel">
      <h2>Tautan</h2>
      <p class="hint">Terhubung ke Google Spreadsheet. Seret ikon titik untuk mengubah urutan, atau pakai tombol panah. Angka di kolom kecil adalah jumlah klik. Kategori bersifat opsional.</p>
      <div id="rows"></div>
      <button id="add">Tambah tautan</button>
      <div class="pw"><input id="pw" type="password" placeholder="Password admin" autocomplete="current-password"><button id="save" class="main">Simpan</button></div>
      <div id="status" role="status"></div>
      <datalist id="cats"></datalist>
    </div>
    <div class="panel pv"><h2>Pratinjau</h2><div class="pvg" id="pv"></div></div>
  </div>
</div>
<script src="../config.js"></script>
<script>
const $=id=>document.getElementById(id);
const PAL=[['#0b4dbb','#2563eb'],['#2563eb','#3b82f6'],['#0b4dbb','#3b82f6'],['#1d4ed8','#7c3aed'],['#0b4dbb','#059669'],['#2563eb','#0b4dbb']];
let links=[],dragFrom=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const host=u=>{try{return new URL(/^https?:\/\//i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'')}catch(e){return u}};
const toRow=x=>({name:String(x.name||''),url:String(x.url),category:String(x.category||''),clicks:Number(x.clicks)||0});
function say(t,err){const s=$('status');s.textContent=t;s.style.color=err?'var(--danger)':'var(--accent)'}
async function load(){
  if(!SHEET_URL){say('SHEET_URL di config.js masih kosong. Isi dulu dengan alamat Web App.',true);return}
  say('Memuat dari spreadsheet...');
  try{
    const r=await fetch(SHEET_URL+'?fresh=1');const j=await r.json();
    links=(j.links||[]).filter(x=>x&&x.url).map(toRow);say('');
  }catch(e){say('Gagal memuat dari spreadsheet. Periksa alamat Web App.',true)}
}
function move(from,to){if(from===to||to<0||to>=links.length)return;const[x]=links.splice(from,1);links.splice(to,0,x);renderRows()}
function renderCats(){
  const dl=$('cats');dl.textContent='';
  [...new Set(links.map(l=>l.category.trim()).filter(Boolean))].forEach(c=>{const o=document.createElement('option');o.value=c;dl.appendChild(o)});
}
function renderPreview(){
  const box=$('pv');box.textContent='';
  if(!links.length){box.textContent='Belum ada tautan.';return}
  const cats=[...new Set(links.map(l=>l.category.trim()).filter(Boolean))];
  const group=(t,items)=>{
    if(t){const h=document.createElement('div');h.className='cat';h.textContent=t;box.appendChild(h)}
    items.forEach(l=>{
      const p=PAL[links.indexOf(l)%PAL.length],name=l.name.trim()||host(l.url)||'(kosong)';
      const m=document.createElement('div');m.className='mini';m.style.cssText=`--c1:${p[0]};--c2:${p[1]}`;
      const b=document.createElement('b');b.textContent=(name[0]||'?').toUpperCase();
      const s=document.createElement('span');const i=document.createElement('i');i.textContent=name;const sm=document.createElement('small');sm.textContent=host(l.url);
      s.append(i,sm);m.append(b,s);box.appendChild(m);
    });
  };
  if(!cats.length)group('',links);
  else{cats.forEach(c=>group(c,links.filter(l=>l.category.trim()===c)));const r=links.filter(l=>!l.category.trim());if(r.length)group('Lainnya',r)}
}
function renderRows(){
  const box=$('rows');box.textContent='';
  links.forEach((l,i)=>{
    const row=document.createElement('div');row.className='row';
    const g=document.createElement('span');g.className='grip';g.textContent='\u283f';g.title='Seret untuk mengubah urutan';
    g.onmousedown=()=>row.draggable=true;
    row.ondragstart=e=>{dragFrom=i;row.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))};
    row.ondragend=()=>{row.draggable=false;row.classList.remove('drag');dragFrom=null};
    row.ondragover=e=>{if(dragFrom!==null){e.preventDefault();row.classList.add('over')}};
    row.ondragleave=()=>row.classList.remove('over');
    row.ondrop=e=>{e.preventDefault();row.classList.remove('over');if(dragFrom!==null)move(dragFrom,i)};
    const f=(ph,key,list)=>{const x=document.createElement('input');x.placeholder=ph;x.value=l[key];if(list)x.setAttribute('list',list);x.oninput=()=>{links[i][key]=x.value;renderPreview();if(key==='category')renderCats()};return x};
    const c=document.createElement('span');c.className='clk';c.textContent=l.clicks+' klik';c.title='Jumlah klik (dari spreadsheet)';
    const b=document.createElement('div');b.className='btns';
    const up=document.createElement('button');up.textContent='\u2191';up.title='Naik';up.onclick=()=>move(i,i-1);
    const dn=document.createElement('button');dn.textContent='\u2193';dn.title='Turun';dn.onclick=()=>move(i,i+1);
    const d=document.createElement('button');d.textContent='\u2715';d.title='Hapus';d.className='del';d.onclick=()=>{links.splice(i,1);renderRows()};
    b.append(up,dn,d);
    row.append(g,f('Nama tampilan','name'),f('https://contoh.com','url'),f('Kategori','category','cats'),c,b);
    box.appendChild(row);
  });
  renderCats();renderPreview();
}
const normalized=()=>links.map(l=>({name:l.name.trim(),url:/^https?:\/\//i.test(l.url.trim())?l.url.trim():'https://'+l.url.trim(),category:l.category.trim()})).filter(l=>l.url!=='https://');
async function save(){
  const password=$('pw').value;
  if(!SHEET_URL){say('SHEET_URL di config.js masih kosong.',true);return}
  if(!password){say('Isi password admin dulu.',true);return}
  $('save').disabled=true;say('Menyimpan ke spreadsheet...');
  try{
    // text/plain agar browser tidak mengirim preflight yang ditolak Apps Script
    const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({password,links:normalized()})});
    const j=await r.json();
    if(j.ok){store.set('pw',password);links=(j.links||[]).map(toRow);renderRows();say('Tersimpan di spreadsheet. Halaman utama berubah dalam sekitar 30 detik.')}
    else say(j.error||'Gagal menyimpan.',true);
  }catch(e){say('Tidak bisa terhubung ke spreadsheet.',true)}
  $('save').disabled=false;
}
$('add').onclick=()=>{links.push({name:'',url:'',category:'',clicks:0});renderRows()};
$('save').onclick=save;
$('pw').value=store.get('pw')||'';
load().then(renderRows);
</script>
</body>
</html>
